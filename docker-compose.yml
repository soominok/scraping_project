# version: "3.8"
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dbpw123!
      MYSQL_DATABASE: scraper
      #MYSQL_USER: root
      #MYSQL_PASSWORD: Wjdalshdr!33
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - my_network
    healthcheck:  
      test: nc -z localhost 2181 || exit 1
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:latest
    # image: wurstmeister/kafka:2.13-2.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      # - zookeeper
      zookeeper:
        condition: service_healthy
    networks:
      - my_network
      
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build: .
    # command: ["sh", "-c", "python -m src.kafka.producer && sleep infinity"]
    command:
      sh -c "python -m src.kafka.producer && while true; do sleep 3600; done"  
      # sh -c "python -c 'from src.db.db import init_db; init_db()' && python -m src.kafka.producer && while true; do sleep 3600; done"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: db
    depends_on:
      # - kafka
      # - db
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      replicas: 5
    networks:
      - my_network
  
  consumer:
    build: .
    command: python -m src.kafka.consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: db
    depends_on:
      # - kafka
      # - db
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      replicas: 5
    networks:
      - my_network

volumes:
  db_data:

networks:
  my_network:
    driver: bridge
